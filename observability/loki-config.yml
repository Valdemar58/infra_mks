auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# retention_period ограничивает рост /loki на диске - без него Loki хранит
# логи бессрочно. compactor.retention_enabled - обязательное условие,
# чтобы retention_period реально применялся (иначе лимит только считается,
# но старые чанки не удаляются).
limits_config:
  retention_period: 2160h # 90 дней
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
