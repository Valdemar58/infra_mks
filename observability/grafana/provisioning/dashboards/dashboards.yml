apiVersion: 1

# Дашборды лежат по папкам: asu для приложения, infra для инфраструктуры.
# allowUiUpdates: true разрешает правки в UI Grafana (сохраняются в
# grafana-data, не в файл). Как перенести изменения обратно в репозиторий,
# написано в README, раздел observability.
providers:
  - name: asu
    orgId: 1
    folder: АСУ МКС
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/asu

  - name: infra
    orgId: 1
    folder: Инфраструктура
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infra
