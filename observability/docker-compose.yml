# Стек логирования (Loki + Grafana Alloy + Grafana), полностью отдельный
# от docker-compose.yml/docker-compose.dev.yml самого приложения:
# собственная сеть, собственные volume'ы, собственный .env - жизненный
# цикл инфры не должен зависеть от деплоя приложения (и наоборот).
#
# Временное расположение внутри репозитория asu_toir - позже эта папка
# планируется объединить с остальными infra-конфигами (пока живут вне git,
# без отдельного репозитория) и вынести в отдельный репозиторий целиком.
#
# Запуск (независимо от docker-compose.yml приложения):
#   docker compose -f infra/observability/docker-compose.yml up -d
#
# Alloy собирает логи контейнеров asu_toir_* через Docker socket/API -
# общая docker-сеть с приложением для этого не нужна (см. alloy-config.alloy).

services:

  loki:
    image: grafana/loki:3.3.0
    container_name: asu_toir_obs_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: asu_toir_obs_alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: asu_toir_obs_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - observability
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:

networks:
  observability:
    driver: bridge
