# Логи и метрики: Loki хранит логи, Prometheus метрики, Alloy собирает
# stdout контейнеров через Docker socket и метрики хоста и контейнеров,
# Grafana показывает. Grafana снаружи только через nginx (HOST_GRAFANA),
# Loki, Prometheus и Alloy наружу не смотрят.
#
# Loki и Prometheus подключены и к app-network под именами loki и
# prometheus: туда пишут Alloy-агенты с других хостов
# (docker-compose.agent.yml). Alloy берет только контейнеры,
# чьи имена подходят под APP_CONTAINER_REGEX из корневого .env.
# Запуск: ./setup.sh в этом каталоге.

services:

  loki:
    image: ${IMAGE_MIRROR:-}grafana/loki:3.3.0
    container_name: infra_obs_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      observability: {}
      app-network:
        aliases:
          - loki
    restart: unless-stopped

  alloy:
    image: ${IMAGE_MIRROR:-}grafana/alloy:v1.5.1
    container_name: infra_obs_alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      APP_NAME: ${APP_NAME:?set APP_NAME in .env}
      APP_CONTAINER_REGEX: ${APP_CONTAINER_REGEX:-${APP_NAME}.*|infra_valhalla.*|infra_tiles|infra_nginx|keycloak(-dev)?}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      METRICS_HOST: ${SERVER_IP:-unknown}
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Каталоги хоста для метрик хоста
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev/data:/run/udev/data:ro
    depends_on:
      - loki
      - prometheus
      - cadvisor
    networks:
      - observability
    restart: unless-stopped

  # Метрики контейнеров хоста, читает только Alloy по сети стека
  cadvisor:
    image: ${IMAGE_MIRROR:-}ghcr.io/google/cadvisor:0.55.1
    container_name: infra_obs_cadvisor
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --enable_metrics=cpu,memory,network
      - --housekeeping_interval=15s
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - observability
    restart: unless-stopped

  # Метрики хоста и контейнеров, пишут только Alloy через remote write
  prometheus:
    image: ${IMAGE_MIRROR:-}prom/prometheus:v3.1.0
    container_name: infra_obs_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-data:/prometheus
    networks:
      observability: {}
      app-network:
        aliases:
          - prometheus
    restart: unless-stopped

  grafana:
    image: ${IMAGE_MIRROR:-}grafana/grafana:11.3.0
    container_name: infra_obs_grafana
    ports:
      # Только для локальной диагностики, снаружи через nginx
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${HOST_GRAFANA:-appsrvs.grafana}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      observability: {}
      app-network:
        aliases:
          - grafana
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
  app-network:
    external: true
