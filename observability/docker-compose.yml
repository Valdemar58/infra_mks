# Логи: Loki хранит, Alloy собирает stdout контейнеров через Docker socket,
# Grafana показывает. Grafana снаружи только через nginx (HOST_GRAFANA),
# Loki и Alloy наружу не смотрят.
#
# Loki подключен и к app-network под именем loki: туда пишут Alloy-агенты
# с других хостов (docker-compose.agent.yml). Alloy берет только контейнеры,
# чьи имена подходят под APP_CONTAINER_REGEX из корневого .env.
# Запуск: ./setup.sh в этом каталоге.

services:

  loki:
    image: ${IMAGE_MIRROR:-}grafana/loki:3.3.0
    container_name: infra_obs_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      observability: {}
      app-network:
        aliases:
          - loki
    restart: unless-stopped

  alloy:
    image: ${IMAGE_MIRROR:-}grafana/alloy:v1.5.1
    container_name: infra_obs_alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      APP_CONTAINER_REGEX: ${APP_CONTAINER_REGEX:-asu_toir.*|infra_valhalla.*}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: ${IMAGE_MIRROR:-}grafana/grafana:11.3.0
    container_name: infra_obs_grafana
    ports:
      # Только для локальной диагностики, снаружи через nginx
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${HOST_GRAFANA:-appsrvs.grafana}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      observability: {}
      app-network:
        aliases:
          - grafana
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:

networks:
  observability:
    driver: bridge
  app-network:
    external: true
