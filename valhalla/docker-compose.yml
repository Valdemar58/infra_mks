# Self-hosted Valhalla: маршрутизация для приложения (матрицы расстояний и
# геометрия маршрутов). Приложение ходит по алиасам valhalla-summer и
# valhalla-winter в app-network, поэтому имена контейнеров можно менять,
# не трогая его .env. Снаружи оба сезона отдает nginx: HOST_ROUTE/summer/
# и HOST_ROUTE/winter/. Порты на хост открыты только на 127.0.0.1.
#
# Установка и обновления: ./setup.sh в этом каталоге, подробности в README.md.
# Зимний сезон под profile winter: setup.sh первый раз наполняет его копией
# летнего тайлсета, зимники добавляются публикацией с season=winter.
#
# Данные bind mount в custom_files/<сезон>: карта готовится prepare_pbf.sh,
# publisher собирает тайлы в staging-каталоге рядом с живым. На Linux
# каталог принадлежит UID 59999 (пользователь образа), setup.sh это делает.
# Первая сборка тайлов идет около часа, контейнер в это время unhealthy.

services:

  valhalla-summer:
    image: ${IMAGE_MIRROR:-}ghcr.io/valhalla/valhalla-scripted:3.8.3
    container_name: infra_valhalla_summer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALHALLA_SUMMER_PORT:-8002}:8002"
    environment:
      server_threads: ${SERVER_THREADS:-8}
      serve_tiles: "True"
      build_tar: "True"
      build_admins: "True"        # корректные границы и правила доступа
      build_time_zones: "True"    # нужно для date_time запросов
      build_elevation: "False"
      force_rebuild: ${FORCE_REBUILD:-False}
    volumes:
      - ./custom_files/summer:/custom_files
    networks:
      app-network:
        aliases:
          - valhalla-summer
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2h   # первая сборка тайлов

  valhalla-winter:
    image: ${IMAGE_MIRROR:-}ghcr.io/valhalla/valhalla-scripted:3.8.3
    container_name: infra_valhalla_winter
    profiles: ["winter"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALHALLA_WINTER_PORT:-8003}:8002"
    environment:
      server_threads: ${SERVER_THREADS:-8}
      serve_tiles: "True"
      build_tar: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      force_rebuild: ${FORCE_REBUILD:-False}
    volumes:
      - ./custom_files/winter:/custom_files
    networks:
      app-network:
        aliases:
          - valhalla-winter
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2h

  # Публикация кастомных дорог: тянет дороги и заявки из API приложения,
  # готовит staging-каталог, собирает тайлы одноразовым контейнером, патчит
  # конфиг, делает смоук и swap, перезапускает живой сервис.
  #
  # HOST_FILES_DIR: publisher создает builder-контейнер на docker-демоне
  # хоста, поэтому путь тома должен быть хостовым, а не путем внутри
  # publisher. Расхождение ловится проверкой перед сборкой.
  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    image: ${IMAGE_MIRROR:-}valhalla-publisher:${PUBLISHER_TAG:-latest}
    container_name: infra_valhalla_publisher
    restart: unless-stopped
    environment:
      ASU_API_URL: ${ASU_API_URL:-http://asu_toir_api:8000}
      ASU_API_TOKEN: ${ASU_API_TOKEN:-}
      FILES_DIR: /custom_files
      HOST_FILES_DIR: ${HOST_FILES_DIR:-${PWD}/custom_files}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-app-network}
      LIVE_CONTAINER_PREFIX: ${LIVE_CONTAINER_PREFIX:-infra_valhalla}
      VALHALLA_IMAGE: ${IMAGE_MIRROR:-}ghcr.io/valhalla/valhalla-scripted:3.8.3
      BUILD_THREADS: ${BUILD_THREADS:-8}
      SNAP_TOLERANCE_M: ${SNAP_TOLERANCE_M:-100}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-30}
    volumes:
      - ./custom_files:/custom_files
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

networks:
  app-network:
    external: true
