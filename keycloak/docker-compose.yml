# Прод: только Keycloak, БД на внешнем Postgres (см. .env.example), наружу
# через nginx (HOST_AUTH). В app-network виден как keycloak.
#
# БД keycloak и пользователь должны существовать на внешнем сервере до
# запуска, compose их не создает. Запуск: ./setup.sh в этом каталоге.

services:

  keycloak:
    image: ${IMAGE_MIRROR:-}quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    # Тема кэшируется: после правки themes/ нужен docker restart keycloak
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KC_HOSTNAME:-${HOST_AUTH:-appsrvs.auth}}
      KC_HOSTNAME_STRICT: "false"

      # Тема входа по умолчанию, у realm master она задана еще и в самом realm
      KC_SPI_THEME__DEFAULT: mks

      # JSON в консоль для Loki, успешные входы на уровне info, иначе их не видно
      KC_LOG_CONSOLE_OUTPUT: json
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL: info
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
