# Прод: только keycloak, без dockerized postgres (внешний сервер - см.
# .env.example) и без nginx (отдельный проект, см. infra/nginx). Подключен
# к внешней сети app-network (та же, что связывает api/streamlit), чтобы
# nginx мог достучаться до keycloak:8080 (см. infra/nginx/docker-compose.yml).
#
# Перед первым запуском:
#   1. docker network create app-network   (если еще не создана)
#   2. БД keycloak + пользователь уже должны существовать на внешнем
#      Postgres-сервере, указанном в KC_DB_URL - compose их не создает.
#
# Запуск:
#   docker compose -f infra/keycloak/docker-compose.yml up -d

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: start --spi-theme-cache-themes=false --spi-theme-cache-templates=false --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KC_HOSTNAME:-appsrvs.auth}
      KC_HOSTNAME_STRICT: "false"

      KC_THEME: mks
      KC_THEME_TYPE: login
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
