# Прод: только Keycloak, БД на внешнем Postgres (см. .env.example), наружу
# через nginx (HOST_AUTH). В app-network виден как keycloak.
#
# БД keycloak и пользователь должны существовать на внешнем сервере до
# запуска, compose их не создает. Запуск: ./setup.sh в этом каталоге.

services:

  keycloak:
    image: ${IMAGE_MIRROR:-}quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: start --spi-theme-cache-themes=false --spi-theme-cache-templates=false --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KC_HOSTNAME:-${HOST_AUTH:-appsrvs.auth}}
      KC_HOSTNAME_STRICT: "false"

      KC_THEME: mks
      KC_THEME_TYPE: login
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
