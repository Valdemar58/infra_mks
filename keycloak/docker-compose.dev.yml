# Dev: Keycloak и одноразовый dockerized postgres, без внешнего сервера.
# Realm без LDAP (с dev-машин нет доступа к контроллеру домена), вместо
# него локальный пользователь admin_dev, тот же username, что у dev-заглушки
# приложения.
#
# Keycloak доступен напрямую по http://localhost:8080 и, если поднят nginx,
# по https://<HOST_AUTH>: алиас keycloak в app-network совпадает с прод.
# Запуск: ./setup.sh --dev в этом каталоге. Админка admin/admin.

services:

  postgres:
    image: ${IMAGE_MIRROR:-}postgres:16
    container_name: keycloak-db-dev
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: ${IMAGE_MIRROR:-}quay.io/keycloak/keycloak:26.6
    container_name: keycloak-dev
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password

      # Без доверия X-Forwarded-Proto от nginx Keycloak генерирует http://
      # ссылки на https-странице, и браузер блокирует их как mixed content.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${HOST_AUTH:-appsrvs.auth}
      KC_HOSTNAME_STRICT: "false"

      KC_THEME: mks
      KC_THEME_TYPE: login
    volumes:
      - ./realm-export.dev.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      default: {}
      app-network:
        aliases:
          - keycloak

volumes:
  pg_data_dev:

networks:
  default: {}
  app-network:
    external: true
