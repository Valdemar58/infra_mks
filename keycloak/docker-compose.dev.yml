# Dev: keycloak + одноразовый dockerized postgres (без внешнего сервера и
# без nginx - Keycloak отдается напрямую по HTTP). Реалм без LDAP (нет
# доступа к ldap://<контроллер домена> с dev-машин) - вместо этого локальный
# пользователь admin_dev, тот же username, что и dev-заглушка на стороне
# самого приложения (src/core/auth/principal.py).
#
# Не требует внешнего Postgres. Опционально подключается к app-network
# (см. infra/nginx/conf.d/keycloak.conf) - если infra/nginx поднят и сеть
# app-network создана (docker network create app-network), Keycloak также
# доступен по https://appsrvs.auth; если нет - работает и без этого,
# напрямую по HTTP на 8080.
#
# Запуск:
#   docker compose -f infra/keycloak/docker-compose.dev.yml up -d
# Keycloak: http://localhost:8080 (админка), логин admin_dev/admin_dev
# для проверки реального OIDC-флоу приложения.

services:

  postgres:
    image: postgres:16
    container_name: keycloak-db-dev
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak-dev
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password

      # Без этого Keycloak не доверяет X-Forwarded-Proto от nginx и может
      # генерировать http:// ссылки/iframe на https-странице - браузер
      # тихо блокирует такой iframe как mixed content (симптом - "Timeout
      # when waiting for 3rd party check iframe message" в консоли/логине).
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: appsrvs.auth
      KC_HOSTNAME_STRICT: "false"

      KC_THEME: mks
      KC_THEME_TYPE: login
    volumes:
      - ./realm-export.dev.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      default: {}
      app-network:
        aliases:
          - keycloak

volumes:
  pg_data_dev:

networks:
  default: {}
  # Внешняя (docker network create app-network) - та же сеть, что связывает
  # api/streamlit и другие infra-модули. nginx (см.
  # infra/nginx/conf.d/keycloak.conf) ищет upstream "keycloak" - алиас выше
  # делает keycloak-dev доступным под этим именем, не трогая container_name
  # (используется для CLI-команд типа docker exec keycloak-dev).
  app-network:
    external: true
