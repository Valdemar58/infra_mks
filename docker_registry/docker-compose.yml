# Приватный Docker-registry с аутентификацией и UI, за общим infra/nginx
# (см. infra/nginx/conf.d/docker_registry.conf, appsrvs.registry).
#
# registry сам по себе не подключен к app-network и никак не виден извне -
# только registry-ui, который сам проксирует /v2/* на registry по
# внутренней сети registry-internal (см. NGINX_PROXY_PASS_URL) - поэтому
# браузер всегда обращается к UI и registry с одного origin, без CORS.
#
# Перед первым запуском:
#   mkdir -p infra/docker_registry/auth
#   docker run --rm --entrypoint htpasswd httpd:2 -Bbn <user> '<password>' \
#     > infra/docker_registry/auth/htpasswd
#
# Запуск:
#   docker compose -f infra/docker_registry/docker-compose.yml up -d

services:

  registry:
    image: registry:3.1.1
    container_name: registry
    restart: unless-stopped
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ./auth/htpasswd:/auth/htpasswd:ro
      - registry_data:/var/lib/registry
    networks:
      - registry-internal
    healthcheck:
      # /v2/ требует авторизации (401 для анонимных) - используем
      # отдельный debug-listener без авторизации, наружу он не смотрит.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/debug/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    container_name: registry_ui
    restart: unless-stopped
    depends_on:
      registry:
        condition: service_healthy
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "asu_toir registry"
      NGINX_PROXY_PASS_URL: http://registry:5000
      DELETE_IMAGES: "true"
      REGISTRY_SECURED: "true"
    networks:
      - app-network
      - registry-internal

volumes:
  registry_data:

networks:
  app-network:
    external: true
  registry-internal:
