# Приватный docker registry с аутентификацией и веб-интерфейсом за nginx
# (HOST_REGISTRY). Сам registry в app-network не подключен: наружу смотрит
# только registry-ui, который проксирует /v2/ на registry по внутренней
# сети registry-internal, поэтому браузер и docker ходят на один origin.
#
# Зеркало образов для прода без интернета живет здесь же, в пространстве
# имен mirror/ (см. offline/mirror.sh и IMAGE_MIRROR в корневом .env).
# Запуск: ./setup.sh в этом каталоге.

services:

  registry:
    image: ${IMAGE_MIRROR:-}registry:3.1.1
    container_name: registry
    restart: unless-stopped
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ./auth/htpasswd:/auth/htpasswd:ro
      - registry_data:/var/lib/registry
    networks:
      - registry-internal
    healthcheck:
      # /v2/ требует авторизации, поэтому проверяется отдельный
      # debug-listener без нее, наружу он не смотрит.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/debug/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  registry-ui:
    image: ${IMAGE_MIRROR:-}joxit/docker-registry-ui:2.6.0
    container_name: registry_ui
    restart: unless-stopped
    depends_on:
      registry:
        condition: service_healthy
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: ${REGISTRY_TITLE:-MKS registry}
      NGINX_PROXY_PASS_URL: http://registry:5000
      DELETE_IMAGES: "true"
      REGISTRY_SECURED: "true"
    networks:
      - app-network
      - registry-internal

volumes:
  registry_data:

networks:
  app-network:
    external: true
  registry-internal:
