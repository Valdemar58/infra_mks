<title>АСУ МКС: технические работы</title>
<style>
  :root {
    --brand: #0079c2;
    --brand-dark: #005a91;
    --bg: #eef1f5;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #5b6776;
    --line: #dde3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111820;
      --card: #1a232d;
      --text: #e6ebf0;
      --muted: #9aa7b5;
      --line: #2b3743;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-top: 4px solid var(--brand);
    box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
  }
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--line);
  }
  header img { display: block; width: 140px; height: 69px; }
  section { padding: 32px 40px 36px; }
  .label {
    margin: 0 0 12px;
    color: var(--brand);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.25;
  }
  p { margin: 0; color: var(--muted); }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brand);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .status a {
    margin-left: auto;
    color: var(--brand);
    font-weight: 600;
    text-decoration: none;
  }
  .status a:hover { color: var(--brand-dark); text-decoration: underline; }
  footer {
    margin-top: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 480px) {
    header { padding: 24px 24px 20px; }
    section { padding: 24px 24px 28px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
