server {
    listen 80;
    server_name appsrvs;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name appsrvs;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s;
    # asu_toir_dev - имя контейнера streamlit в dev (docker-compose.dev.yml);
    # для прода - asu_toir (см. docker-compose.yml).
    set $upstream_streamlit asu_toir_dev;

    location / {
        proxy_pass http://$upstream_streamlit:8501;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Streamlit держит соединение с браузером через WebSocket
        # (авто-обновление интерфейса) - без апгрейда до WS страница
        # загрузится, но останется "зависшей", не реагируя на ввод.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
