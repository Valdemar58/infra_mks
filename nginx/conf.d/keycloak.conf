server {
    listen 80;
    server_name appsrvs.auth;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name appsrvs.auth;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS-резолвинг keycloak на момент запроса (embedded Docker DNS), а не
    # при старте воркера - nginx и keycloak теперь отдельные compose-проекты
    # без depends_on между ними, keycloak может быть еще не поднят к моменту
    # старта nginx.
    resolver 127.0.0.11 valid=10s;
    set $upstream_keycloak keycloak;

    location / {
        proxy_pass http://$upstream_keycloak:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
