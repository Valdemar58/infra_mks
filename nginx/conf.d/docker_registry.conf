server {
    listen 80;
    server_name appsrvs.registry;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name appsrvs.registry;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker-регистри гоняет большие бинарные слои образов - нужно
    # отключить буферизацию и снять лимит на размер тела запроса, иначе
    # крупные push будут падать или буферизоваться на диск целиком перед
    # проксированием.
    client_max_body_size 0;
    chunked_transfer_encoding on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900;
    proxy_send_timeout 900;

    resolver 127.0.0.11 valid=10s;
    set $upstream_registry_ui registry_ui;

    location / {
        proxy_pass http://$upstream_registry_ui:80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;
    }
}
