# Заглушка технических работ вместо 502/503/504 самого nginx: приложение
# не запущено, не резолвится или не ответило. proxy_intercept_errors не
# включен, поэтому ошибки, которые вернуло само приложение, проходят как есть.
# Подключать на уровне server.
error_page 502 503 504 =503 /__maintenance.html;

location = /__maintenance.html {
    internal;
    root /usr/share/nginx/maintenance;
    charset utf-8;
    try_files /maintenance.html =503;
    # add_header не наследуется в location со своими add_header
    include /etc/nginx/snippets/security_headers.conf;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
}
