# Ответ API, когда приложение недоступно, в формате обработчика ошибок
# приложения. Подключать на уровне server.
error_page 502 503 504 =503 @api_unavailable;

location @api_unavailable {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error_code":"service_unavailable","detail":"Сервис временно недоступен, проводятся технические работы"}';
}
