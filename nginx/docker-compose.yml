# Reverse-proxy для всех сервисов и приложения. Конфиги в templates/
# рендерятся образом nginx при старте контейнера: подставляются только
# переменные HOST_*, APP_* и SERVER_IP из корневого .env, переменные
# самого nginx ($host, $upstream_*) не трогаются.
#
# Новый сервис: templates/<сервис>.conf.template, HOST_<СЕРВИС> в корневом
# .env, сервис в сети app-network. После правки шаблонов или .env:
#   ./compose.sh nginx up -d --force-recreate   (или ./nginx/setup.sh)
# Сертификат nginx перечитывает по nginx -s reload, это делает certs/setup.sh.

services:

  nginx:
    image: ${IMAGE_MIRROR:-}nginx:1.27-alpine
    container_name: infra_nginx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    environment:
      NGINX_ENVSUBST_FILTER: ^(HOST_|APP_|SERVER_IP)
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ../certs:/etc/nginx/certs:ro
      # Кэш тайлов подложки переживает пересоздание контейнера
      - tiles-cache:/var/cache/nginx/tiles
    networks:
      - app-network
    restart: unless-stopped

volumes:
  tiles-cache:

networks:
  app-network:
    external: true
